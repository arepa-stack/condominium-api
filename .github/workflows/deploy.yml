name: Deploy (SSH)

on:
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    if: contains(fromJSON('["jholbert1","diangogav"]'), github.actor)

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            set -euo pipefail
            cd /orgs/condominium/condominium-api
            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S git config --global --add safe.directory /orgs/condominium/condominium-api
            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S git pull origin main

            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S docker build -t condominium-api .

            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S docker stop condominium-api || true
            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S docker rm condominium-api || true

            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S docker run -d --name condominium-api -p 127.0.0.1:3000:3000 --env-file ./.env condominium-api
            echo "${{ secrets.SSH_PASSWORD }}" | sudo -S docker image prune -f
